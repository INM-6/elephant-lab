[build-system]
requires = ["hatchling>=1.3.1", "jupyterlab>=4.0.0,<5.0.0", "hatch-nodejs-version", "hatch-jupyter-builder>=0.5"]
build-backend = "hatchling.build"

[project]
name = "jupyphant"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
"ipytree",
"ipympl",
"joblib",
"ipywidgets",
"jsonschema",
"jupyter-packaging",
"jupyter-client",
"jupyter-core",
"jupyter-server",
"jupyterlab",
"jupyterlab-pygments",
"jupyterlab-server",
"jupyterlab-widgets",
"nodejs",
"numpy",
"pip",
"neo",
"nixio",
"elephant",
"quantities",
"traitlets",
"plotly<6"
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[project.optional-dependencies]
test = [
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-tornasync",
    "matplotlib"
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls"]


[tool.hatch.build.targets.sdist]
include = [
    "jupyphant",
    "style",
    "src",
    "package.json",
    "tsconfig.json",
    "install.json",
    "yarn.lock",
    "README.md",
    "LICENSE"
]
exclude = [".github"]

[tool.hatch.build]
artifacts = ["jupyphant/labextension"]


[tool.hatch.build.targets.wheel.shared-data]
"jupyphant/labextension" = "share/jupyter/labextensions/jupyphant"
"install.json" = "share/jupyter/labextensions/jupyphant/install.json"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyphant/labextension/static/style.js",
    "jupyphant/labextension/package.json",
]


[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]


[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[build-system]
requires = ["hatchling>=1.3.1", "jupyterlab>=4.0.0,<4.4.9", "hatch-nodejs-version"]
build-backend = "hatchling.build"

[project]
name = "jupyphant"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 3",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
"ipytree",
"ipympl",
"joblib",
"ipywidgets",
"jsonschema",
"jupyter-packaging",
"jupyter-client",
"jupyter-core",
"jupyter-server",
"jupyterlab",
"jupyterlab-pygments",
"jupyterlab-server",
"jupyterlab-widgets",
"matplotlib",
"nodejs",
"numpy",
"pip",
"neo",
"elephant@git+https://github.com/JanNolten/elephant#egg=feature/pydantic",
"viziphant",
"quantities",
"traitlets"
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[project.optional-dependencies]
test = [
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-tornasync"
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls"]

[tool.hatch.build]
artifacts = ["jupyphant/labextension"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyphant/labextension" = "share/jupyter/labextensions/jupyphant"
"install.json" = "share/jupyter/labextensions/jupyphant/install.json"

[tool.hatch.build.targets.sdist]
exclude = [".github"]

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyphant/labextension/static/style.js",
    "jupyphant/labextension/package.json",
]
skip-if-exists = ["jupyphant/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "."
build_dir = "jupyphant/labextension"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

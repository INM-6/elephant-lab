[build-system]
requires = ["hatchling>=1.21.0", "jupyterlab>=4.0.0,<5.0.0", "hatch-nodejs-version", "hatch-jupyter-builder>=0.5"]
build-backend = "hatchling.build"

[project]
name = "elephant-lab"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "ipywidgets",
    "ipykernel",
    "jupyter-server",
    "jupyterlab>=4.0.0",
    "numpy>=1.10.0",
    "neo>=0.10.0",
    "nixio>=1.5.0",
    "elephant>=1.1.0",
    "quantities",
    "plotly>4.0",
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[project.optional-dependencies]
test = [
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "matplotlib"
]

[tool.hatch.version]
source = "nodejs"


[tool.hatch.metadata.hooks.nodejs]
fields = ["version", "description", "authors", "urls", "keywords"]


[tool.hatch.build.targets.sdist]
include = [
    "elephant_lab",
    "style",
    "src",
    "doc",
    "schema",
    "package.json",
    "tsconfig.json",
    "install.json",
    "yarn.lock",
    "README.md",
    "LICENSE"
]
exclude = [".github"]

[tool.hatch.build]
artifacts = ["elephant_lab/labextension"]


[tool.hatch.build.targets.wheel.shared-data]
"elephant_lab/labextension" = "share/jupyter/labextensions/elephant-lab"
"install.json" = "share/jupyter/labextensions/elephant-lab/install.json"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "elephant_lab/labextension/static/style.js",
    "elephant_lab/labextension/package.json",
]


[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]


[tool.jupyter-releaser.options]
version_cmd = "hatch version"
